name: macOS installer
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            arch: x64
          - os: macos-15
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:installer
      - name: Assemble and check self-contained ZIP
        run: npm run package:macos
      - uses: actions/upload-artifact@v4
        with:
          name: job-search-harness-macos-${{ matrix.arch }}
          path: dist/job-search-harness-macos-${{ matrix.arch }}.zip
          if-no-files-found: error
